name: argus-doc-reader
version: 2.0.0
description: >
  静态/动态分层的路由清单。SKILL.md 据此决定每次任务加载哪些片段。
  主轴是 env（本机环境档位），由 scripts/detect_env.py 探测确定；
  安装细节、故障排除、输出格式等深度材料全部放在按需加载的 references 中。

always_load:
  - static/core/contract.md
  - static/core/workflow.md

axes:
  env:
    detect: |
      阻塞门。运行 scripts/detect_env.py（若已有目标 venv 则用其 python 运行），
      取输出 JSON 的 route 字段。脚本不可用时手动确认 GPU 型号/显存与
      paddle 安装状态后取值，禁止猜测。
    values:
      not_installed:     fragments/env/not-installed.md
      nvidia_16gb_plus:  fragments/env/nvidia-16gb.md
      nvidia_8gb:        fragments/env/nvidia-8gb.md
      cpu_only:          fragments/env/cpu-only.md
    multi: false

references:
  on_demand:
    - condition: 从零安装；选择 CUDA 版本；驱动/Python 版本确认；模型缓存位置规划
      path: references/install.md
    - condition: 安装或运行报错；NVML/显存/下载/超时/性能问题
      path: references/troubleshooting.md
    - condition: 解读解析结果；block label 词汇表；JSON/Markdown 结构；二次加工
      path: references/output-format.md
    - condition: 实测基线、已知盲区、判读纪律的由来（含真实案例数据）
      path: references/case-study.md
